# The optional Fallow semantic sidecar requires the Go compiler; normal Rust checks remain enabled.
ignoredOptionalDependencies:
  - fallow-type-aware
allowBuilds:
  cpu-features: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
# Vite+ selects package.json's pnpm pin; avoid a second toolchain lockfile document.
# https://github.com/pnpm/pnpm/issues/13805
pmOnFail: ignore
overrides:
  # Vite+'s optional legacy compiler is unused: TSRS owns checking and SDK types.
  "@voidzero-dev/vite-plus-core>typescript": "-"
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5
