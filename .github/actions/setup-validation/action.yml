name: Set up validation
description: Install the pinned validation toolchain and project dependencies.

inputs:
  cache:
    description: Cache the validation toolchain and project dependencies.
    default: "true"
  install-bun:
    description: Install the pinned Bun version for package-manager tests.
    default: "false"
  registry-url:
    description: Optional npm registry URL used to configure publishing authentication.
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        version: "0.3.3"
        node-version-file: ".node-version"
        cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}
        run-install: |
          - args: ["--frozen-lockfile"]

    - name: Set up pnpm for direct commands
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        install: false
        node-version-file: "false"

    - name: Set up Bun
      if: inputs.install-bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.2"
