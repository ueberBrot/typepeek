name: Set up validation
description: Install the pinned validation toolchain and project dependencies.

inputs:
  cache:
    description: Cache the validation toolchain and project dependencies.
    default: "true"
  install-bun:
    description: Install the pinned Bun version for package-manager tests.
    default: "false"
  registry-url:
    description: Optional npm registry URL used to configure publishing authentication.
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
      with:
        node-version: "24.18.0"
        cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}
        run-install: |
          - args: ["--frozen-lockfile"]

    - name: Activate pnpm
      shell: bash
      run: |
        corepack enable pnpm
        pnpm --version

    - name: Set up Bun
      if: inputs.install-bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.0"
