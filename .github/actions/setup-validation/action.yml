name: Set up validation
description: Install the pinned validation toolchain and project dependencies.

inputs:
  cache:
    description: Cache the validation toolchain and project dependencies.
    default: "true"
  registry-url:
    description: Optional npm registry URL used to configure publishing authentication.
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.4.4"

    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        version: "1.4.0"
        node-version-file: ".node-version"
        cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}
        run-install: |
          - args: ["--frozen-lockfile"]

    - name: Set up pnpm for consumer compatibility tests
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        version: "12.16.1"
        install: false
        node-version-file: "false"
