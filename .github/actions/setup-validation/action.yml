name: Set up validation
description: Install the pinned validation toolchain and project dependencies.

inputs:
  install-bun:
    description: Install the pinned Bun version for package-manager tests.
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
      with:
        node-version: "24.18.0"
        cache: true

    - name: Set up Bun
      if: inputs.install-bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.14"

    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile
