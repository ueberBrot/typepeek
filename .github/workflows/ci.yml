name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_GIT_HOOKS: "0"

jobs:
  native:
    name: Native distribution
    uses: ./.github/workflows/native-binaries.yml

  changesets:
    name: Changeset release plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Calculate release changes
        id: changesets
        uses: changesets/action/pr-status@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      - name: Report release changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: changesets/action/pr-comment@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          body: ${{ steps.changesets.outputs.comment-body }}

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up validation
        uses: ./.github/actions/setup-validation

      - name: Check formatting, lint, and types
        run: vp run check

      - name: Check Effect diagnostics
        run: vp run effect-check

      - name: Analyze with Fallow
        run: vp run fallow

  test:
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/3
          - 2/3
          - 3/3

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up validation
        uses: ./.github/actions/setup-validation

      - name: Test
        run: vp test --exclude tests/packaged-cli-consumers.test.ts --shard=${{ matrix.shard }} --maxWorkers=1

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up validation
        uses: ./.github/actions/setup-validation

      - name: Pack
        run: vp run pack

      - name: Smoke-test package
        run: vp run package-smoke

      - name: Check benchmark workload correctness (no model calls or timing gates)
        run: vp run benchmark:smoke

  consumer-compatibility:
    name: Consumer compatibility (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up validation
        uses: ./.github/actions/setup-validation

      - name: Test packaged CLI consumers
        run: vp test tests/static-inspection-tripwire.test.ts tests/packaged-cli-consumers.test.ts
