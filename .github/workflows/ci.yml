name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_GIT_HOOKS: "0"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up validation
        uses: ./.github/actions/setup-validation

      - name: Check formatting, lint, and types
        run: vp run check

      - name: Check Effect diagnostics
        run: vp run effect-check

      - name: Analyze with Fallow
        run: vp run fallow

  test:
    name: Tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up validation
        uses: ./.github/actions/setup-validation
        with:
          install-bun: "true"

      - name: Test
        run: vp test --exclude tests/packaged-cli-consumers.test.ts

  package:
    name: Package
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up validation
        uses: ./.github/actions/setup-validation

      - name: Pack
        run: vp run pack

      - name: Smoke-test package
        run: vp run package-smoke

  consumer-compatibility:
    name: Consumer compatibility (${{ matrix.os }})
    needs:
      - test
      - package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up validation
        uses: ./.github/actions/setup-validation
        with:
          install-bun: "true"

      - name: Test packaged CLI consumers
        run: vp test tests/packaged-cli-consumers.test.ts
